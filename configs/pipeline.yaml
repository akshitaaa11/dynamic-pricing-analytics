project:
  name: dynamic-pricing-analytics
  owner: academic-team
  python_version: "3.11"
  java_version: "17"
  spark_version: "3.5.1"

paths:
  raw_excel: data/raw/online_retail_II.xlsx
  reference_workbook: data/reference/Dynamic_Pricing_Processed_Data final.xlsx
  bronze_dir: data/bronze
  silver_dir: data/silver
  gold_dir: data/gold
  stream_dir: data/stream
  external_dir: data/external
  reports_dir: reports

periods:
  start_date: "2009-12-01"
  end_date: "2011-12-09"
  train_start: "2009-12-07"
  train_end: "2011-06-05"
  validation_start: "2011-06-06"
  validation_end: "2011-09-04"
  test_start: "2011-09-05"
  test_end: "2011-11-27"
  partial_weeks:
    - "2009-11-30"
    - "2011-12-05"

quality:
  expected_clean_rows: 1033062
  expected_sale_rows: 1015088
  expected_gross_units: 11221957
  expected_gross_revenue: 19700954.44
  expected_cancellation_value: -719692.94
  price_epsilon: 1e-6
  negative_price_allowed: false

cleaning:
  non_merchandise_codes:
    - POST
    - DOT
    - M
    - D
    - S
    - C2
    - C3
    - B
    - AMAZONFEE
    - BANK CHARGES
    - CRUK
    - DCGS0067
    - DCGS0073
  non_merchandise_prefixes:
    - ADJUST
    - TEST
    - GIFT

guardrails:
  min_order_quantity: 1
  max_order_cap_units: 10000
  max_price_change_pct: 0.10
  observed_markdown_threshold_pct: 0.10
  min_weeks_for_elasticity: 12
  max_zero_fill_weeks_per_product: 8
  availability_gap_weeks: 4
  demand_interval_confidence: 0.80
  forecast_horizon_weeks: 4

features:
  rolling_window_weeks: [4, 8, 12]
  lag_weeks: [1, 2, 4, 8, 12]
  price_reference_weeks: 8
  rfm_recency_window_days: 365

modeling:
  random_seed: 42
  metric: wape
  baseline_orders: [seasonal_naive, moving_average]
  forecast_target: units
  feature_columns:
    - lag_1_units
    - lag_2_units
    - lag_4_units
    - lag_8_units
    - lag_12_units
    - rolling_mean_4_units
    - rolling_mean_8_units
    - rolling_mean_12_units
    - rolling_std_4_units
    - month
    - iso_week
    - weeks_to_christmas
    - weeks_since_launch
  lightgbm:
    objective: poisson
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    n_jobs: 4
    early_stopping_rounds: 30

reporting:
  figure_format: html

streaming:
  watermark_minutes: 120
  tumbling_window_hours: [1, 24, 168]
  update_interval_seconds: 5

monitoring:
  log_level: INFO
  spark_sql_session_timezone: UTC
